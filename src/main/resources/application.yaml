spring:
  application:
    name: spring-boot-crud-lambda-dynamodb
  profiles:
    active: local

amazon:
  dynamodb:
    endpoint: https://dynamodb.us-east-1.amazonaws.com
  aws:
    region: us-east-1

app:
  data-init:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.ce: INFO
    software.amazon.awssdk: WARN

cors:
  allowed:
    origins: '*'

application:
  description: '@project.description@'
  name: '@project.artifactId@'

build:
  timestamp: '@maven.build.timestamp@'
  version: '@project.version@'

modules:
  logging:
    logs:
      folder:
        path: ./logs
    application:
      name: '@project.artifactId@'

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
